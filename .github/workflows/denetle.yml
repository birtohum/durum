name: Günlük denetim
on:
  schedule:
    - cron: "10 8 * * *"   # 11:10 Türkiye saati; sitelerin sabah güncellemeleri bitmiş olur
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
concurrency:
  group: denetim
  cancel-in-progress: false
jobs:
  denetle:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Siteleri dene
        run: node kontrol.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Bozuk site varsa konu aç, düzeldiyse kapat
        run: node bildir.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Sonucu kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veri
          git commit -m "Denetim $(date -u +%F)" || exit 0
          git pull --rebase
          git push
